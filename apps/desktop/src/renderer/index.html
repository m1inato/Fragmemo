<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: fragmemo:; media-src 'self' data: fragmemo:; font-src 'self' data: fragmemo:; connect-src 'self' fragmemo: ws://localhost:*; frame-src 'self' about:"
    />
    <title>Fragmemo</title>
    <script>
      // Set the theme before the first paint so dark mode never flashes white.
      ;(function () {
        var t = new URLSearchParams(location.search).get('theme') || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
