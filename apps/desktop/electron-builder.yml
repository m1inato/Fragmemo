appId: app.fragmemo.desktop
productName: Fragmemo
copyright: Copyright © 2026 m1inato
directories:
  output: dist
  buildResources: build
# Everything is bundled by electron-vite; the app ships no node_modules.
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.education
  icon: build/icon.png
  target: dir
  # Not notarized: sign ad hoc so the app launches on Apple Silicon.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  executableName: fragmemo
  target: dir
  icon: build/icon.png
